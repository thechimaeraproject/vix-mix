<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Vix Mix: three channel strips, each a meter in the console's gradient under its fader,
       in the colours of app/src/theme.rs (STRIP, CTL_HI, BLACK, the METER stops, ACCENT). -->
  <title>Vix Mix</title>
  <defs>
    <linearGradient id="meter" gradientUnits="userSpaceOnUse" x1="0" y1="99" x2="0" y2="29">
      <stop offset="0" stop-color="#2c9a55"/>
      <stop offset="0.48" stop-color="#4cc46d"/>
      <stop offset="0.64" stop-color="#9fcf43"/>
      <stop offset="0.76" stop-color="#e2b83a"/>
      <stop offset="0.84" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#e5484d"/>
    </linearGradient>
  </defs>
  <rect x="9" y="9" width="110" height="110" rx="21" fill="#212226" stroke="#383a40" stroke-width="2"/>
  <rect x="25" y="26" width="18" height="76" rx="3" fill="#0c0d0e"/>
  <rect x="55" y="26" width="18" height="76" rx="3" fill="#0c0d0e"/>
  <rect x="85" y="26" width="18" height="76" rx="3" fill="#0c0d0e"/>
  <rect x="28" y="56" width="12" height="43" rx="1.5" fill="url(#meter)"/>
  <rect x="58" y="44" width="12" height="55" rx="1.5" fill="url(#meter)"/>
  <rect x="88" y="70" width="12" height="29" rx="1.5" fill="url(#meter)"/>
  <rect x="21" y="45" width="26" height="6" rx="2" fill="#5aa8ff"/>
  <rect x="51" y="60" width="26" height="6" rx="2" fill="#5aa8ff"/>
  <rect x="81" y="52" width="26" height="6" rx="2" fill="#5aa8ff"/>
</svg>
