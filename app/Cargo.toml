[package]
name = "vix-mix"
description = "The Vix Mix window: winit + egui + wgpu over the Host trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vix-mix"
path = "src/main.rs"

[dependencies]
vixmix-host.workspace = true
vixmix-model.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
# The look gate's capture (`--dump-png`): the frame as an RGBA PNG. Already in the lock
# through the workspace's other crates, so it adds nothing to resolve.
png = "0.18"
# The editor events and sizes `Host::tick_editors` and `Host::open_editor` hand back, named
# where the window matches them. Already built for vixmix-host, at the kit's one tag.
chimaeraproject-vst3-host.workspace = true
# The meter fader, the scale, peak hold and the taper trait the console draws with; its sizes
# and colours stay in theme.rs.
chimaeraproject-egui-audio.workspace = true

# The signals that ask the window to close (SIGTERM, SIGINT, SIGHUP), so a `pkill` or a logout
# runs the shutdown order as closing the window does. Unix only: Windows asks through the window.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
# The tests' `Recorder` wraps `FakeHost` and implements `Host`, whose `catalog` names the
# plugins crate's `Catalog`. Tests only: the window itself depends on the host and the model.
vixmix-plugins.workspace = true
