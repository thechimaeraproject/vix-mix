[package]
name = "vixmix-plugins"
description = "Everything between the kit's VST3 host and the mixer: the catalog, instances on the UI thread, the rack that lends them to chains, state and editor sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vixmix_plugins"

[dependencies]
vixmix-model.workspace = true
vixmix-engine.workspace = true
chimaeraproject-vst3-host.workspace = true
chimaeraproject-audio-processor.workspace = true
chimaeraproject-param.workspace = true
chimaeraproject-fs.workspace = true
raw-window-handle.workspace = true
rtrb.workspace = true # the edit ring from an instance's controller to its lent processor
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
log.workspace = true

# A scan's child process leads a process group of its own; stopping it kills the group, so a
# bridge's helper processes go with it (`killpg`). Already in the lock through the kit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_no_alloc.workspace = true # tests/no_alloc.rs: the lent handle must never touch the allocator
# The test plugin's COM bindings (examples/test_gain.rs). The same major the kit's VST3 host
# builds on, so Cargo.lock gains nothing.
vst3 = "0.3"

# The test plugin the integration tests load: a copy of the kit's, derived from the `vst3`
# crate's gain example. `cargo test` builds examples, so the gates build it with no extra step;
# a dependency's own example is built only when asked for by name.
[[example]]
name = "test_gain"
crate-type = ["cdylib"]
test = false
doc = false

# Two plugins that misbehave while they load, for the scan's child process
# (tests/scan_child.rs): a VST3 module only as far as its entry points go, aborting in them or
# never returning from them.
[[example]]
name = "test_abort"
crate-type = ["cdylib"]
test = false
doc = false

[[example]]
name = "test_hang"
crate-type = ["cdylib"]
test = false
doc = false

# The scan's child for the tests, standing in for `vix-mix --scan-bundle`: `answer_scan` on its
# first argument, with noise around the answer as a plugin would print.
[[example]]
name = "scan_bundle"
test = false
doc = false
