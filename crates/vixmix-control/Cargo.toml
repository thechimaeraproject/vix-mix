[package]
name = "vixmix-control"
description = "The control from outside: the request and reply lines, the addresses over a setup, the service that serves clients, and on Unix the socket and the ctl command's client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vixmix_control"

[dependencies]
vixmix-model.workspace = true
log.workspace = true
thiserror.workspace = true
# A name in double quotes, written and read as JSON writes text, so a quote or a line end in a
# channel's name stays inside one line. Already in the lock through the kit's VST3 host.
serde_json = "1"

[dev-dependencies]
proptest.workspace = true # tests/requests.rs: a request sends only the commands this crate names
